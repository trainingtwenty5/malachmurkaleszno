<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Grafik zajęć — Mała Chmurka Leszno</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Grafik zajęć w Małej Chmurce w Lesznie — sprawdź terminy i zapisz dziecko online.">
<meta name="theme-color" content="#3D5A78">
<link rel="icon" href="/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/mc-common.css?v=7">
<style>
  /* ---- dwa najbliższe terminy ---- */
  .soon{margin:0 0 22px}
  .soon-head{font-size:1.05rem;margin:0 0 10px}
  .soon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .soon-card{display:block;background:var(--white);border:1px solid var(--line);
    border-left-width:5px;border-radius:var(--radius);padding:14px 16px;
    box-shadow:var(--shadow-sm);color:inherit}
  .soon-card:hover{text-decoration:none;box-shadow:var(--shadow);transform:translateY(-1px)}
  .soon-when{font-size:.82rem;color:var(--muted);font-family:var(--font-head);font-weight:600}
  .soon-title{font-family:var(--font-head);font-weight:700;color:var(--navy-deep);
    font-size:1.02rem;margin:3px 0 4px;line-height:1.25}
  .soon-meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
  .soon-meta span{background:var(--cream);border-radius:999px;padding:.12em .6em}
  .soon-in{color:var(--brand-deep);font-weight:700}

  /* ---- przełącznik widoku ---- */
  .view-switch{display:flex;gap:4px;background:var(--cream-deep);padding:4px;border-radius:999px}
  .view-switch button{padding:.38em .95em;border-radius:999px;font-family:var(--font-head);
    font-weight:600;font-size:.86rem;color:var(--navy-deep);white-space:nowrap}
  .view-switch button.is-on{background:var(--white);box-shadow:var(--shadow-sm);color:var(--brand-deep)}

  /* ---- widok miesiąca ---- */
  .month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .month-name{font-family:var(--font-head);font-weight:700;font-size:.78rem;color:var(--muted);
    text-align:center;padding:4px 0}
  .month-cell{min-height:96px;background:var(--white);border:1px solid var(--line);
    border-radius:12px;padding:6px 7px;width:100%;text-align:left;display:block;
    font:inherit;color:inherit;cursor:pointer;transition:.15s var(--ease)}
  .month-cell:not(.is-empty):hover{border-color:var(--brand-deep);box-shadow:var(--shadow-sm)}
  .month-cell.is-empty{cursor:default}
  .month-cell.is-other{background:var(--cream);opacity:.55}
  .month-cell.is-today{border-color:var(--brand-deep);background:var(--brand-pale)}
  .month-num{display:block;font-family:var(--font-head);font-weight:700;font-size:.84rem;color:var(--navy-deep)}
  .month-ev{display:block;font-size:.72rem;line-height:1.3;border-radius:6px;padding:2px 5px;
    margin-top:3px;color:var(--navy-deep);background:var(--sky-pale);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .month-more{font-size:.7rem;color:var(--muted);margin-top:3px;display:block}

  @media (max-width:760px){
    .soon-grid{grid-template-columns:1fr}
    .month{gap:4px}
    .month-cell{min-height:70px;padding:4px 5px}
    .month-ev{font-size:.66rem}
  }
</style>
<style>
  .cal-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
  .cal-intro p{margin:0}
</style>
</head>
<body>

<main class="page">
  <div class="container">

    <div class="cal-intro">
      <div>
        <h1>Grafik zajęć</h1>
        <p class="lead">Kliknij w kafelek, żeby zobaczyć szczegóły zajęć i zapisać dziecko.</p>
      </div>
    </div>

    <!-- dwa najbliższe terminy — zanim ktokolwiek zacznie przeglądać kalendarz -->
    <section class="soon" id="soon" hidden>
      <h2 class="soon-head">Najbliższe zajęcia</h2>
      <div class="soon-grid" id="soonGrid"></div>
    </section>

    <div class="cal-toolbar">
      <button class="cal-nav" id="prev" aria-label="Poprzedni zakres">‹</button>
      <button class="cal-nav" id="next" aria-label="Następny zakres">›</button>
      <button class="btn btn-soft cal-today btn-auto" id="today">Dziś</button>
      <div class="cal-range" id="range">—</div>
      <div class="view-switch" role="group" aria-label="Widok kalendarza">
        <button data-view="day">Dzień</button>
        <button data-view="week" class="is-on">Tydzień</button>
        <button data-view="month">Miesiąc</button>
      </div>
    </div>

    <div class="cal">
      <!-- widok tygodniowy (desktop) -->
      <div class="cal-scroll">
        <div class="cal-inner">
          <div class="cal-head" id="head"><div class="gut"></div></div>
          <div class="cal-body" id="body"><div class="gut-col" id="gut"></div></div>
        </div>
      </div>
      <!-- widok agendy (telefon) -->
      <div class="cal-agenda" id="agenda"></div>
    </div>

    <p class="hint day-hint" id="dayHint" hidden>Wybierz zajęcia z listy poniżej,
      żeby zobaczyć szczegóły i zapisać dziecko.</p>

    <div class="month" id="month" hidden></div>

    <div class="legend" id="legend"></div>

    <div class="loading" id="loading"><span class="spin"></span> Wczytuję grafik…</div>
    <div id="err"></div>
  </div>
</main>

<script type="module">
import { mountChrome, $, $$, esc, DAY_NAMES, DAY_SHORT, MONTHS_GEN,
         weekStart, addDays, isoDate, toMin, fmtMin, longDate, shortDate,
         URLS, SETTINGS, seatState, signupClosed, money, MONTHS } from './assets/mc-common.js';
import { watchEvents, listEvents, todayISO } from './assets/mc-data.js';

mountChrome({ current: 'Grafik zajęć', crumb: 'Grafik zajęć' });

const SLOT = 34;                 // px na 30 minut
const PXM  = SLOT / 30;
let monday = weekStart(new Date());
let unsub = null;

/* 'day' | 'week' | 'month' — tydzień zostaje domyślny, bo tak grafik wygląda
   dziś i tak przyzwyczajeni są klienci. */
let view = 'week';
let anchor = new Date();          // dzień, wokół którego liczymy zakres

const cmpISO = isoDate;

function bounds(list) {
  let s = toMin(SETTINGS.dayStart), e = toMin(SETTINGS.dayEnd);
  list.forEach(ev => {
    s = Math.min(s, Math.floor(toMin(ev.start) / 60) * 60);
    e = Math.max(e, Math.ceil(toMin(ev.end) / 60) * 60);
  });
  return [s, Math.max(e, s + 120)];
}

/* ==========================================================================
   Wybór widoku. Siatka tygodniowa zostaje dokładnie taka, jak była — dzień
   i miesiąc to nowe tryby obok niej.
   ========================================================================== */
function render(list) {
  const cal = document.querySelector('.cal');
  const month = $('#month');

  $('#dayHint').hidden = true;
  if (view === 'month') {
    cal.hidden = true; month.hidden = false;
    renderMonth(list);
  } else {
    cal.hidden = false; month.hidden = true;
    /* Klasa, a nie `hidden` na siatce: samo ukrycie siatki nie wystarczało,
       bo agenda jest domyślnie schowana poza telefonem. Klasa przełącza oba
       widoki naraz — patrz `.cal.is-day` w mc-common.css. */
    cal.classList.toggle('is-day', view === 'day');
    if (view === 'day') renderDay(list); else renderWeek(list);
  }
  $('#loading').hidden = true;
}

/** Lista „dzień po dniu" — na telefonie jedyny widok, w trybie dnia także na desktopie. */
function agendaHtml(days, list, todayIso) {
  return days.map(d => {
    const iso = cmpISO(d);
    const evs = list.filter(e => e.date === iso && e.active !== false)
                    .sort((x, y) => toMin(x.start) - toMin(y.start));
    const items = evs.length ? evs.map(ev => {
      const st = seatState(ev);
      const free = st.free;
      return `<a class="agenda-item" href="${URLS.event}?id=${encodeURIComponent(ev.id)}">
        <span class="agenda-bar" style="background:${esc(ev.color || '#93C7CF')}"></span>
        <span style="min-width:0;flex:1">
          <span class="agenda-time">${esc(ev.start)}–${esc(ev.end)}</span>
          <span class="agenda-title">${esc(ev.title)}</span>
          <span class="agenda-meta">${st.state === 'closed' ? 'termin zapisów upłynął'
            : free ? free + ' z ' + (ev.capacity || 0) + ' wolnych miejsc' : 'brak wolnych miejsc'}
            · ${ev.ageMin ?? 0}–${ev.ageMax ?? 6} lat</span>
        </span></a>`;
    }).join('') : '<div class="agenda-empty">Brak zajęć tego dnia.</div>';

    return `<section class="agenda-day${iso === todayIso ? ' is-today' : ''}">
      <div class="agenda-head"><span class="d">${DAY_NAMES[(d.getDay() + 6) % 7]}</span>
        <span class="n">${d.getDate()} ${MONTHS_GEN[d.getMonth()]}${iso === todayIso ? ' · dziś' : ''}</span></div>
      <div class="agenda-list">${items}</div></section>`;
  }).join('');
}

function legend(list) {
  const seen = new Map();
  list.forEach(e => { if (e.active !== false && !seen.has(e.color)) seen.set(e.color, e.title); });
  $('#legend').innerHTML = [...seen].slice(0, 8)
    .map(([c, t]) => `<span><i style="background:${esc(c || '#93C7CF')}"></i>${esc(t)}</span>`).join('');
}

/* ---------------------------------------------------------- widok dnia --- */
function renderDay(list) {
  const d = new Date(anchor);
  $('#range').textContent = longDate(cmpISO(d));
  $('#dayHint').hidden = false;
  $('#agenda').innerHTML = agendaHtml([d], list, cmpISO(new Date()));
  legend(list);
}

/* -------------------------------------------------------- widok miesiąca - */
function renderMonth(list) {
  const y = anchor.getFullYear(), m = anchor.getMonth();
  $('#range').textContent = `${MONTHS[m]} ${y}`;

  const first = weekStart(new Date(y, m, 1));
  const last  = addDays(weekStart(new Date(y, m + 1, 0)), 6);
  const todayIso = cmpISO(new Date());

  const cells = [];
  for (let d = new Date(first); d <= last; d = addDays(d, 1)) {
    const iso = cmpISO(d);
    const evs = list.filter(e => e.date === iso && e.active !== false)
                    .sort((x, y2) => toMin(x.start) - toMin(y2.start));
    /* Kafelki są tylko podglądem — kliknięcie w dzień otwiera CAŁY dzień,
       a dopiero tam wybiera się konkretne zajęcia. Na telefonie to jedyny
       sensowny ruch: w komórce miesiąca nie da się rzetelnie wybrać godziny. */
    const chips = evs.slice(0, 3).map(ev =>
      `<span class="month-ev" style="background:${esc(ev.color || '#93C7CF')}33"
             title="${esc(ev.title)} · ${esc(ev.start)}–${esc(ev.end)}">${esc(ev.start)} ${esc(ev.title)}</span>`).join('');
    const puste = evs.length === 0;
    cells.push(`<button type="button" class="month-cell${d.getMonth() !== m ? ' is-other' : ''}${
        iso === todayIso ? ' is-today' : ''}${puste ? ' is-empty' : ''}"
        data-day="${iso}" ${puste ? 'disabled' : ''}
        aria-label="${esc(longDate(iso))}${puste ? ', brak zajęć' : `, zajęć: ${evs.length}`}">
        <span class="month-num">${d.getDate()}</span>${chips}
        ${evs.length > 3 ? `<span class="month-more">+${evs.length - 3} więcej</span>` : ''}
      </button>`);
  }

  $('#month').innerHTML =
    DAY_SHORT.map(n => `<div class="month-name">${esc(n)}</div>`).join('') + cells.join('');

  $$('#month [data-day]').forEach(el => el.onclick = () => {
    const [y2, m2, d2] = el.dataset.day.split('-').map(Number);
    anchor = new Date(y2, m2 - 1, d2);
    setView('day');
  });

  legend(list);
}

/* -------------------------------------------------------- widok tygodnia - */
function renderWeek(list) {
  const days = [...Array(7)].map((_, i) => addDays(monday, i));
  const a = days[0], b = days[6];
  $('#range').textContent = a.getMonth() === b.getMonth()
    ? `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[a.getMonth()]} ${a.getFullYear()}`
    : `${a.getDate()} ${MONTHS_GEN[a.getMonth()]} – ${b.getDate()} ${MONTHS_GEN[b.getMonth()]} ${b.getFullYear()}`;

  const todayIso = cmpISO(new Date());
  const [START, END] = bounds(list);

  /* ---------- nagłówek dni ---------- */
  const head = $('#head');
  head.innerHTML = '<div class="gut"></div>';
  days.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'day-head' + (i >= 5 ? ' is-weekend' : '') + (cmpISO(d) === todayIso ? ' is-today' : '');
    el.innerHTML = `<div class="day-num">${d.getDate()}</div><div class="day-name">${DAY_NAMES[i]}</div>`;
    head.appendChild(el);
  });

  /* ---------- oś godzin ---------- */
  const gut = $('#gut');
  gut.innerHTML = '';
  for (let m = START + 30; m <= END; m += 30) {
    const h = document.createElement('div');
    h.className = 'hour';
    h.innerHTML = m % 60 === 0 ? `<span>${fmtMin(m)}</span>` : '';
    gut.appendChild(h);
  }

  /* ---------- kolumny dni ---------- */
  const body = $('#body');
  [...body.querySelectorAll('.day-col')].forEach(n => n.remove());

  days.forEach((d, i) => {
    const iso = cmpISO(d);
    const col = document.createElement('div');
    col.className = 'day-col';
    for (let m = START; m < END; m += 30) {
      const s = document.createElement('div');
      s.className = 'slot' + (m % 60 === 30 ? ' hour-line' : '');
      col.appendChild(s);
    }
    const evs = list.filter(e => e.date === iso && e.active !== false)
                    .map(e => ({ ...e, s: toMin(e.start), e2: toMin(e.end) }))
                    .sort((x, y) => x.s - y.s);

    // proste układanie obok siebie, gdy zajęcia się nakładają
    const ends = [];
    evs.forEach(ev => {
      let idx = ends.findIndex(t => t <= ev.s);
      if (idx === -1) { ends.push(ev.e2); idx = ends.length - 1; } else ends[idx] = ev.e2;
      ev.col = idx;
    });
    const cols = Math.max(1, ends.length);

    evs.forEach(ev => {
      const top = (ev.s - START) * PXM;
      const h = Math.max(20, (ev.e2 - ev.s) * PXM - 3);
      const st = seatState(ev);
      const free = st.free;
      const el = document.createElement('a');
      el.href = `${URLS.event}?id=${encodeURIComponent(ev.id)}`;
      el.className = 'ev' + (h < 52 ? ' is-short' : '') + (st.state !== 'open' ? ' is-full' : '');
      el.style.cssText = `top:${top}px;height:${h}px;background:${ev.color || '#93C7CF'};` +
        `left:calc(${(ev.col / cols) * 100}% + 3px);width:calc(${100 / cols}% - 6px);`;
      el.title = `${ev.title}\n${ev.start}–${ev.end}\n${free} z ${ev.capacity} wolnych`;
      el.innerHTML = `<div class="ev-title">${esc(ev.title)}</div>
        <div class="ev-sub">${ev.start}–${ev.end}</div>
        <div class="ev-sub">${st.state === 'closed' ? 'termin minął'
          : free ? free + ' / ' + (ev.capacity || 0) + ' wolnych' : 'brak miejsc'}</div>`;
      col.appendChild(el);
    });
    body.appendChild(col);
  });

  /* ---------- agenda dla telefonów ---------- */
  $('#agenda').innerHTML = agendaHtml(days, list, todayIso);

  legend(list);
}

function load() {
  if (unsub) unsub();
  $('#loading').hidden = false;
  const [a, b] = range();
  const from = cmpISO(a), to = cmpISO(b);
  unsub = watchEvents(from, to, list => {
    $('#err').innerHTML = '';
    render(list);
  });
  // gdyby baza nie odpowiedziała (np. brak konfiguracji) — pokaż podpowiedź
  setTimeout(() => {
    if (!$('#loading').hidden) {
      $('#err').innerHTML = `<div class="alert alert-warn">Nie udało się wczytać grafiku.
        Sprawdź konfigurację Firebase w <code>assets/firebase-config.js</code>
        albo zadzwoń do nas: <a href="tel:${SETTINGS.phoneHref}">${SETTINGS.phone}</a>.</div>`;
    }
  }, 7000);
}

/* ==========================================================================
   ZAKRES DAT ZALEŻNY OD WIDOKU
   ========================================================================== */
function range() {
  if (view === 'day')   return [new Date(anchor), new Date(anchor)];
  if (view === 'month') {
    const first = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    const last  = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
    /* siatka miesiąca zaczyna się w poniedziałek i kończy w niedzielę */
    return [weekStart(first), addDays(weekStart(last), 6)];
  }
  return [new Date(monday), addDays(monday, 6)];
}

function step(dir) {
  if (view === 'day')        anchor = addDays(anchor, dir);
  else if (view === 'month') anchor = new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1);
  else { monday = addDays(monday, 7 * dir); anchor = new Date(monday); }
  load();
}

function setView(v) {
  view = v;
  $$('.view-switch button').forEach(b => b.classList.toggle('is-on', b.dataset.view === v));
  if (v === 'week') monday = weekStart(anchor);
  load();
}
$$('.view-switch button').forEach(b => b.onclick = () => setView(b.dataset.view));

$('#prev').onclick  = () => step(-1);
$('#next').onclick  = () => step(1);
$('#today').onclick = () => { anchor = new Date(); monday = weekStart(anchor); load(); };

/* ==========================================================================
   DWA NAJBLIŻSZE TERMINY
   Osobne zapytanie, bo mają być widoczne niezależnie od przeglądanego zakresu.
   ========================================================================== */
async function renderSoon() {
  try {
    const to = addDays(new Date(), 90);
    const list = (await listEvents(todayISO(), isoDate(to)))
      .filter(e => e.active !== false && !signupClosed(e))
      .slice(0, 2);
    if (!list.length) { $('#soon').hidden = true; return; }

    $('#soonGrid').innerHTML = list.map(e => {
      const st = seatState(e);
      const dni = Math.round((new Date(e.date + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
      const kiedy = dni === 0 ? 'dziś' : dni === 1 ? 'jutro' : `za ${dni} dni`;
      return `<a class="soon-card" style="border-left-color:${esc(e.color || '#93C7CF')}"
                 href="${URLS.event}?id=${encodeURIComponent(e.id)}">
          <div class="soon-when">${esc(longDate(e.date))} · ${esc(e.start)}–${esc(e.end)}
            <span class="soon-in">${esc(kiedy)}</span></div>
          <div class="soon-title">${esc(e.title || 'Zajęcia')}</div>
          <div class="soon-meta">
            <span>${esc(st.short)}</span>
            <span>${esc(money(e.price))}</span>
            ${e.ageMin !== undefined ? `<span>${e.ageMin}–${e.ageMax} lat</span>` : ''}
          </div>
        </a>`;
    }).join('');
    $('#soon').hidden = false;
  } catch (e) {
    $('#soon').hidden = true;      // brak najbliższych terminów nie blokuje grafiku
  }
}

renderSoon();
load();
</script>
</body>
</html>
