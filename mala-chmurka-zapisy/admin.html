<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zarządzanie zajęciami — Mała Chmurka</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/img/favicon.svg">
<!-- ==========================================================================
     Ta strona była kiedyś osobnym panelem „Zarządzanie zajęciami" — z własnym
     logowaniem, własnym paskiem zakładek i własną kopią okna edycji zajęć.
     Cała jej treść mieszka teraz w karcie 6 panelu administratora, więc nie ma
     już powodu utrzymywać dwóch ekranów robiących to samo.

     Zostaje sam przekierowanie, a nie 404: adres /admin i ten plik siedzą
     w zakładkach, w historii przeglądarek i w starszych notatkach. Kto tu
     trafi, ma wylądować tam, gdzie ta funkcja jest teraz, a nie zobaczyć błąd.

     `location.replace` zamiast `href`: nie zostawia tej strony w historii,
     więc „wstecz" z panelu wraca tam, skąd użytkownik naprawdę przyszedł,
     a nie odbija się z powrotem tutaj.
     ========================================================================== -->
<script>
  (function () {
    var qs = new URLSearchParams(location.search);
    /* `?new=1` niesiemy dalej — starsze linki „Nowe zajęcia" mają nadal
       otwierać okno nowych zajęć od razu po wejściu. */
    var cel = 'panel-admina.html?tab=events' + (qs.get('new') === '1' ? '&new=1' : '');
    location.replace(cel);
  })();
</script>
<meta http-equiv="refresh" content="0; url=panel-admina.html?tab=events">
<style>
  body{margin:0;padding:48px 24px;font:16px/1.6 'Nunito','Segoe UI',system-ui,sans-serif;
       background:#FBF7F1;color:#2C3540;text-align:center}
  a{color:#3E7C89}
</style>
</head>
<body>
  <!-- Widoczne tylko wtedy, gdy JavaScript jest wyłączony, a odświeżenie
       jeszcze nie zadziałało. -->
  <p>Zarządzanie zajęciami jest teraz w panelu administratora, w karcie 6.</p>
  <p><a href="panel-admina.html?tab=events">Przejdź do panelu →</a></p>
</body>
</html>
